# dsh-hashline-edittool bundle patch: mount the host-plane plugin row.
# Installed via `dsh plugin add dsh-hashline-edittool` (or a profile's bundle list).
# The plugin hooks the agent-start lifecycle (agent/created on dsh >= 0.1.6;
# legacy agent/session-start before) and shadows the built-in read/edit/write
# tools (plus undo_last_edit / grep / ast_grep / ast_edit / lsp) on each
# no preset editing or user config is needed.
#
# The SAME package also declares `dsh.client` (browser half at
# exports["./client"]): dsh's client module system scans this mounted row and
# serves the web card bundle into the boot graph — one install ships the host
# tools AND the web cards. No second row, no second package.
- insert:
    - id: dsh-hashline-edittool
      name: dsh-hashline-edittool