name: Release

# Turns a pushed version tag (v0.1.x, created by `npm run release`, or pushed
# manually) into a GitHub Release and an npm publish. The release body is the
# version's `## [X.Y.Z]` section from CHANGELOG.md, extracted automatically;
# falls back to generated notes when the section is missing (e.g. a publish
# without a changelog entry).
#
# The npm publish uses OIDC trusted publishing: npmjs.com trusts THIS
# workflow (package settings → Trusted Publisher), so no long-lived npm
# token lives in this repository and no browser step is ever needed.
on:
  push:
    tags:
      - "v*"
  # Manual re-trigger for tags that predate CI enablement (or any tag):
  #   gh workflow run release.yml -f tag=v0.X.Y
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create the GitHub Release for (e.g. v0.4.1). Defaults to the pushed tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — skipping"
            exit 0
          fi
          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          # print the CHANGELOG section for this version (from its `## [X.Y.Z]`
          # header up to the next `## [` header), including ### subheadings
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ -s "$NOTES_FILE" ]; then
            gh release create "$TAG" --repo "$REPO" --notes-file "$NOTES_FILE" --title "$TAG"
          else
            echo "no CHANGELOG section for $VERSION — falling back to generated notes"
            gh release create "$TAG" --repo "$REPO" --generate-notes --title "$TAG"
          fi

  publish:
    # Publishes the package to npm over OIDC. The registry trusts this
    # workflow by name (npmjs.com → the package → Trusted Publisher →
    # GitHub Actions → `release.yml`), so no npm token is stored anywhere and
    # no browser confirmation is involved. npm swaps the workflow's OIDC token
    # for a short-lived publish credential, which also stamps provenance on
    # the tarball.
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release
    permissions:
      id-token: write # OIDC — the whole point of trusted publishing
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # A manual dispatch names the tag in the input, not in the ref.
          ref: ${{ inputs.tag || github.ref_name }}
          # The tag must be LOCAL: `prepublishOnly` refuses to publish a
          # version whose `vX.Y.Z` tag is missing from this checkout.
          fetch-depth: 0
      - name: Refuse a ref that is not this version's tag
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$REF" != "v$VERSION" ]; then
            echo "ref $REF does not match package.json version $VERSION — refusing to publish"
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd7f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # Trusted publishing needs npm CLI >= 11.5.1 (the version that knows
      # how to swap the workflow's OIDC token for a publish credential).
      - name: Make sure the npm CLI knows OIDC
        run: npm install -g npm@latest
      # `npm publish` runs `prepublishOnly` itself: typecheck + test + build
      # + the tag gate. `postpublish` finds the tag already there and does
      # nothing — the tag push, not the publish, is what created it.
      - name: Publish
        run: npm publish
